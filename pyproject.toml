[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rushi-training"
version = "0.1.0"
description = "如是：可追溯的佛法训练数据与模型微调实验"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["mlx-lm[train]; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
rushi = "rushi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
